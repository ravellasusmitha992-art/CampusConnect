<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#E8A33D" stroke-width="1.5" opacity="0.35">
    <!-- Pediment roof -->
    <path d="M 80 160 L 300 60 L 520 160 Z" />
    <!-- Base platform -->
    <line x1="60" y1="160" x2="540" y2="160" />
    <line x1="50" y1="340" x2="550" y2="340" />
    <line x1="40" y1="360" x2="560" y2="360" />
    <!-- Columns -->
    <line x1="110" y1="160" x2="110" y2="340" />
    <line x1="170" y1="160" x2="170" y2="340" />
    <line x1="230" y1="160" x2="230" y2="340" />
    <line x1="300" y1="160" x2="300" y2="340" />
    <line x1="370" y1="160" x2="370" y2="340" />
    <line x1="430" y1="160" x2="430" y2="340" />
    <line x1="490" y1="160" x2="490" y2="340" />
    <!-- Column capitals -->
    <line x1="100" y1="160" x2="120" y2="160" />
    <line x1="160" y1="160" x2="180" y2="160" />
    <line x1="220" y1="160" x2="240" y2="160" />
    <line x1="290" y1="160" x2="310" y2="160" />
    <line x1="360" y1="160" x2="380" y2="160" />
    <line x1="420" y1="160" x2="440" y2="160" />
    <line x1="480" y1="160" x2="500" y2="160" />
    <!-- Steps -->
    <line x1="70" y1="340" x2="530" y2="340" />
    <!-- Door -->
    <rect x="280" y="260" width="40" height="80" />
  </g>
  <g fill="none" stroke="#E8A33D" stroke-width="1.2" opacity="0.22">
    <!-- Orbiting dots, subtle academic/graduation motif -->
    <circle cx="300" cy="30" r="3" fill="#E8A33D" stroke="none" />
    <path d="M 260 20 L 300 5 L 340 20 L 300 35 Z" />
    <line x1="340" y1="20" x2="340" y2="45" />
  </g>
</svg>
